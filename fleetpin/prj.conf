# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# New Libc
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y

# LTE link control
CONFIG_LTE_LINK_CONTROL=y

# PSM enable
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00100110" # 6 hour
CONFIG_LTE_PSM_REQ_RAT="00000011" # 6 sec active time

# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_MODEM_KEY_MGMT=y

# Date Time library
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y
CONFIG_DATE_TIME_AUTO_UPDATE=y
# 12 hour updates
CONFIG_DATE_TIME_UPDATE_INTERVAL_SECONDS=43200
CONFIG_DATE_TIME_NTP_QUERY_TIME_SECONDS=3600

# Logging
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y

# EPAPER (SPI)
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_GPIO=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y
CONFIG_TFM_LOG_LEVEL_SILENCE=y  # TFM fix to disable UART1, since SPI1 is used for e-Paper

# Regulator control
CONFIG_REGULATOR=y
# Zephyr Device Power Management
# CONFIG_PM_DEVICE=y

# Enable flash operations.
# CONFIG_SPI=y # Already enabled above in EPAPER (SPI) section
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# Enable the LittleFS file system.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Erase
# CONFIG_APP_WIPE_STORAGE=y

# Log immediate
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Partition manager settings
CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# cJSON
CONFIG_CJSON_LIB=y

# HTTP
CONFIG_HTTP_CLIENT=y

# MBED TLS for Authentication
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_NRF_SECURITY=y
CONFIG_NORDIC_SECURITY_BACKEND=y

# Debug
# CONFIG_ASSERT=y
# CONFIG_RESET_ON_FATAL_ERROR=n

# Change host
CONFIG_CLOUD_HOSTNAME="fota.fleetpin.com"
# Endpoints defined in code, as there are multiple
#CONFIG_CLOUD_PUBLISH_PATH="/api/device/data"
# If using TLS, the port has to be 443 for https
CONFIG_CLOUD_PORT=3000

# SIM Card's APN
# CONFIG_APN_DEFAULT_VALUE="onemondo" # Onemondo APN
CONFIG_APN_DEFAULT_VALUE="m2m" # Spark APN

# Device configuration specific
CONFIG_DEVICE_ID=1